; OUI Spy — Waveshare ESP32-S3-Touch-AMOLED-1.75 (466×466 round AMOLED)
; Build:  pio run -e oui-spy-175 -t upload
; Serial: pio device monitor -b 115200

[env:oui-spy-175]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder
upload_speed   = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
board_build.filesystem          = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -std=gnu++17
    -Wno-deprecated-declarations

build_unflags = -std=gnu++11

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.4
    lvgl/lvgl @ 8.4.0
    h2zero/NimBLE-Arduino @ ^1.4.0
    bblanchon/ArduinoJson @ ^7.0.4
    earlephilhower/ESP8266Audio @ ^1.9.7
    earlephilhower/ESP8266SAM @ ^1.0.0
